name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.4"
  PNPM_VERSION: "11.17.0"

jobs:
  # Medusa genera `.medusa/types` durante el build. Sin esos artefactos el
  # typecheck no conoce los servicios de los módulos y falla con TS18046.
  build:
    name: Tipos Medusa y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generar tipos y compilar
        run: pnpm --filter @dtc/backend build
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medusa_build
          JWT_SECRET: ci-build-only-jwt-secret
          COOKIE_SECRET: ci-build-only-cookie-secret
          STORE_CORS: http://localhost:3000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:3000,http://localhost:9000
      - name: Publicar tipos generados
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: medusa-types
          path: apps/backend/.medusa/types
          include-hidden-files: true
          if-no-files-found: error
      - name: Build storefront
        run: pnpm --filter storefront build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY: pk_ci_placeholder

  static:
    name: Tipos, lint y unitarias
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Descargar tipos Medusa
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: medusa-types
          path: apps/backend/.medusa/types
      - name: Typecheck backend
        run: pnpm --filter @dtc/backend typecheck
      - name: Typecheck storefront
        run: pnpm --filter storefront typecheck
      - name: Lint
        run: pnpm lint
      - name: Unitarias backend
        run: pnpm --dir apps/backend test:unit
      - name: Validar artefactos de staging
        run: |
          for script in deploy/staging/*.sh; do sh -n "$script"; done
          docker compose --env-file deploy/staging/.env.staging.example -f deploy/staging/compose.yaml config --quiet

  integration-modules:
    name: Integración de módulos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_ci_modules
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_ci_modules
      JWT_SECRET: ci-integration-jwt-secret
      COOKIE_SECRET: ci-integration-cookie-secret
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integración de módulos
        run: pnpm --dir apps/backend test:integration:modules

  integration-http:
    name: Integración HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_ci_http
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_ci_http
      JWT_SECRET: ci-integration-jwt-secret
      COOKIE_SECRET: ci-integration-cookie-secret
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integración HTTP (matriz de seguridad)
        run: pnpm --dir apps/backend test:integration:http

  security:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detección de secretos
        uses: gitleaks/gitleaks-action@5425999620c418539c61a8143f29e346d5f6cf08 # v2.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high
