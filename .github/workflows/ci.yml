name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.4"
  PNPM_VERSION: "11.17.0"

jobs:
  static:
    name: Tipos, lint y unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck backend
        run: pnpm --filter @dtc/backend typecheck
      - name: Typecheck storefront
        run: pnpm --filter storefront typecheck
      - name: Lint
        run: pnpm lint
      - name: Unitarias backend
        run: pnpm --dir apps/backend test:unit
      - name: Build backend
        run: pnpm --filter @dtc/backend build
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medusa_build
          JWT_SECRET: ci-build-only-jwt-secret
          COOKIE_SECRET: ci-build-only-cookie-secret
          STORE_CORS: http://localhost:3000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:3000,http://localhost:9000

  integration:
    name: Integración de módulos y HTTP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_ci
      JWT_SECRET: ci-integration-jwt-secret
      COOKIE_SECRET: ci-integration-cookie-secret
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integración de módulos
        run: pnpm --dir apps/backend test:integration:modules
      - name: Integración HTTP (matriz de seguridad)
        run: pnpm --dir apps/backend test:integration:http

  security:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detección de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (informativa)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
